[project]
name = "lock-gp-demo"
version = "0.1.0"
description = "Minimal demo of LOCK GP on CR6261-H1 antibody dataset."
authors = [{name = "LOCK-GP Demo", email = "jankowiak@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "gpytorch>=1.11",
    "botorch>=0.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lock_gp"]

