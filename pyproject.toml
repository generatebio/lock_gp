[project]
name = "lock-gp"
version = "0.1.0"
description = "Minimal demo of LOCK GP on CR6261-H1 antibody dataset."
authors = [
    {name = "Martin Jankowiak", email = "jankowiak@gmail.com"},
    {name = "Yerdos Ordabayev", email = "yordabayev@generatebiomedicines.com"},
    {name = "Rudraksh Tuwani", email = "rtuwani@generatebiomedicines.com"},
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "gpytorch>=1.11",
    "botorch>=0.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lock_gp"]

[tool.ruff]
line-length = 120

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

